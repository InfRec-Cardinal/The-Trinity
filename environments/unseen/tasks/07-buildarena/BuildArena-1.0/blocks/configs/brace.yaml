description: 'The Brace is a block that can be used to connect two separated blocks
  with a solid hinge. It can be used to enhance two blocks that are already connected
  together, or to assemble structures that are separated in the space. The mass of
  this block is always the same regardless of the length. Brace must be connected
  between two attachable faces of existing blocks, it cannot be directly attached
  to a single block.

