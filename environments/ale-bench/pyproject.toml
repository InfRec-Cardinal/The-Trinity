[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ale_bench", "src/ale_bench_eval"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[project]
name = "ale_bench"
dynamic = ["version"]
description = "The official library for the ALE-Bench"
authors = [
    { name = "Yuki-Imajuku", email = "yuki.imjk@gmail.com" },
    { name = "Ino-Ichan", email = "sys.b11noway@gmail.com" },
]
readme = {text = "", content-type = "text/plain"}
requires-python = ">=3.10,<3.15"
license = { file = "LICENSE" }
keywords = ["benchmark", "algorithmic programming", "atcoder", "AHC", "AI evaluation", "heuristic", "optimization", "estimation"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ahocorapy",
    "cairosvg",
    "docker",
    "huggingface-hub",
    "pillow",
    "polars>=1",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]

[project.urls]
Repository = "https://github.com/SakanaAI/ALE-Bench"

[project.optional-dependencies]
eval = [
    "fire>=0.7.0",
    "genai-prices>=0.1.0",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "psutil>=7.0.0",
    "pydantic-ai[bedrock]>=2.17.0",
]

[tool.uv]
exclude-newer = "1 week"

[tool.uv-dynamic-versioning]
fallback-version = "0.0.0"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "docker: marks tests as docker (deselect with '-m \"not docker\"')",
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [
    "*.md",
    "dockerfiles/tests",
    "mcp",
    "src/ale_bench_eval/codes",
    "src/ale_bench_eval/prompts/texts.py",
    "tests/judge/codes",
]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",               
    "W",                 
    "F",                 
    "I",              
    "N",                    
    "YTT",                  
    "ANN",                         
    "ASYNC",                 
    "S",                      
    "BLE",                          
    "FBT",                          
    "B",                       
    "A",                        
    "COM",                    
    "C4",                             
    "DTZ",                       
    "T10",                      
    "EM",                     
    "EXE",                        
    "FA",                                 
    "INT",                     
    "ISC",                                 
    "ICN",                                
    "LOG",                     
    "G",                              
    "INP",                                 
    "PIE",                 
    "T20",                   
    "PYI",                 
    "PT",                           
    "Q",                      
    "RSE",                   
    "RET",                    
    "SLF",                  
    "SIM",                      
    "SLOT",                  
    "TID",                          
    "TC",                            
    "ARG",                              
    "PTH",                         
    "FLY",                       
    "PERF",              
    "D",                   
    "PGH",                   
    "PL",                                                  
    "UP",                 
    "FURB",            
    "RUF",                    
    "TRY",                  
]
ignore = [
    "BLE001",                      
    "COM812",                                                  
    "D203",                                                                
    "D213",                                                                
    "FBT001",                                                            
    "FBT002",                                                                    
    "ISC001",                                                          
    "PLR0911",                             
    "PLR0912",                    
    "PLR0913",                     
    "PLR0915",                      
    "PLR0917",                                
]

[tool.ruff.lint.per-file-ignores]
"src/ale_bench_eval/**/*.py" = [
    "D",                                                   
    "T201",                                      
]
"tests/**/*.py" = [
    "ARG",                                       
    "D",                                         
    "INP001",                                               
    "PLR2004",                                 
    "S101",                                 
    "SLF001",                                               
]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
default-section = "third-party"
known-first-party = [
    "ale_bench",
    "ale_bench_eval"
]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]
split-on-trailing-comma = true

[tool.ty.src]
exclude = [
    "dockerfiles/tests/**",
    "mcp/**",
    "src/ale_bench_eval/codes/**",
    "tests/judge/codes/**",
]
