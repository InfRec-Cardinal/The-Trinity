<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trinity Studio · Node Preview</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">Trinity<span>Studio</span></div>
  <div class="menu">
    <button class="menu-btn" data-menu="workflow" data-i18n="workflow"></button>
    <div class="dropdown" id="menu-workflow">
      <button data-act="new" data-i18n="newPage"></button>
      <hr>
      <button data-act="open-file" data-i18n="openFile"></button>
      <button data-act="import-search" data-i18n="importSearch"></button>
      <button data-act="save-file" data-i18n="saveFile"></button>
      <hr>
      <button data-act="open-server" data-i18n="openServer"></button>
      <button data-act="save-server" data-i18n="saveServer"></button>
      <hr>
      <button data-act="undo" data-i18n="undo" disabled></button>
      <button data-act="redo" data-i18n="redo" disabled></button>
      <button data-act="rename" data-i18n="rename"></button>
      <button data-act="arrange" data-i18n="arrange"></button>
      <button data-act="fit" data-i18n="fit"></button>
    </div>
  </div>
  <div id="tabs"></div>
  <div class="spacer"></div>
  <div class="run-group">
    <button id="run" class="run-btn" disabled><span class="play">▶</span><span data-i18n="run"></span></button>
    <button id="run-more" class="run-btn caret" disabled aria-label="More run options">▾</button>
    <div class="dropdown right" id="menu-run">
      <button data-act="run"><b data-i18n="run"></b><small data-i18n="runHint"></small></button>
      <button data-act="scratch"><b data-i18n="scratch"></b><small data-i18n="scratchHint"></small></button>
    </div>
    <button id="stop" class="stop-btn" disabled>■ <span data-i18n="stop"></span></button>
  </div>
  <button id="open-environments" class="ghost" data-i18n="environments"></button>
  <button id="lang" class="ghost"></button>
  <button id="toggle-theme" type="button" class="ghost" aria-label="Switch to dark mode" title="Switch to dark mode">
    <svg class="theme-moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
    <svg class="theme-sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button id="open-settings" class="ghost" data-i18n="settings"></button>
  <button id="toggle-sidebar" class="ghost" aria-label="Toggle node library">☰</button>
</header>
<main>
  <div id="canvas">
    <div id="world">
      <svg id="links"></svg>
      <div id="nodes"></div>
    </div>
    <div id="branch-focus" hidden><span id="branch-focus-label"></span><button id="clear-focus" type="button" data-i18n="showAllBranches"></button></div>
    <section id="minimap-shell" class="collapsed" aria-label="Canvas overview">
      <div class="map-heading"><span data-i18n="overviewMap"></span><button id="toggle-minimap" type="button" class="ghost" aria-expanded="false">▸</button></div>
      <svg id="minimap" viewBox="0 0 200 124" role="img" tabindex="0" aria-label="Canvas overview"></svg>
      <div class="map-controls"><button id="map-zoom-out" type="button">−</button><output id="map-zoom"></output><button id="map-zoom-in" type="button">+</button><button id="map-fit" type="button" data-i18n="fit"></button></div>
    </section>
    <div id="marquee"></div>
    <div id="hint"></div>
    <div id="stats"></div>
  </div>
  <section id="node-stage" aria-labelledby="stage-title" hidden>
    <header class="stage-heading"><div><button id="stage-back" type="button" data-i18n="backToTree"></button><span class="stage-eyebrow" data-i18n="stageHeading"></span><h1 id="stage-title"></h1><p id="stage-meta" class="muted"></p></div><button id="stage-details" type="button" data-i18n="nodeDetails"></button></header>
    <label class="stage-picker"><span data-i18n="stagePick"></span><select id="stage-select"></select></label>
    <div id="stage-body"></div>
  </section>
  <aside id="sidebar">
    <div id="library-panel">
    <h2 data-i18n="parts"></h2>
    <p class="muted" data-i18n="partsHint"></p>
    <input id="part-search" type="search">
    <div id="parts"></div>
    </div>
    <section id="node-inspector" hidden aria-labelledby="inspector-name">
      <div class="inspector-toolbar"><span data-i18n="nodeDetails"></span><button id="close-inspector" type="button" class="ghost" data-i18n="backToLibrary"></button></div>
      <h2 id="inspector-name"></h2><div id="inspector-meta" class="muted"></div>
      <div class="inspector-actions"><button id="inspector-locate" type="button" data-i18n="locateNode"></button><button id="inspector-focus" type="button" data-i18n="focusBranch"></button></div>
      <div id="inspector-tabs" role="tablist" aria-label="Node details">
        <button id="inspector-tab-inputs" type="button" role="tab" data-detail-tab="inputs" aria-controls="inspector-content" data-i18n="detailInputs"></button>
        <button id="inspector-tab-outputs" type="button" role="tab" data-detail-tab="outputs" aria-controls="inspector-content" data-i18n="detailOutputs"></button>
        <button id="inspector-tab-history" type="button" role="tab" data-detail-tab="history" aria-controls="inspector-content" data-i18n="detailHistory"></button>
        <button id="inspector-tab-errors" type="button" role="tab" data-detail-tab="errors" aria-controls="inspector-content" data-i18n="detailErrors"></button>
      </div>
      <div id="inspector-content" role="tabpanel" tabindex="0"></div>
    </section>
  </aside>
</main>
<section id="log">
  <div class="log-head"><span data-i18n="log"></span><span id="run-state"></span><button id="clear-log" class="ghost" data-i18n="clearLog"></button><button id="toggle-log" class="ghost">▾</button></div>
  <pre id="log-body"></pre>
</section>
<dialog id="environments-dialog" aria-labelledby="environments-title">
  <h3 id="environments-title" data-i18n="envTitle"></h3>
  <p class="muted" data-i18n="envHint"></p>
  <details id="environment-catalog"><summary><span data-i18n="envTasks"></span> (<span id="environment-count">—</span>)</summary><ul id="environment-tasks"></ul></details>
  <h4 data-i18n="envResources"></h4>
  <p id="environment-status" role="status" aria-live="polite"></p>
  <progress id="environment-progress" aria-label="Environment download progress"></progress>
  <p id="environment-detail" class="muted"></p>
  <ul id="environment-assets"></ul>
  <p id="environment-error" class="warn" role="alert" hidden></p>
  <p class="muted" data-i18n="envLocal"></p>
  <menu>
    <button id="environment-check" type="button" data-i18n="envCheck"></button>
    <button id="environment-download" type="button" data-i18n="envDownload"></button>
    <button id="environment-close" type="button" data-i18n="close" autofocus></button>
  </menu>
</dialog>
<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog">
    <h3 id="settings-title" data-i18n="settings"></h3>
    <label><span data-i18n="connection"></span>
      <select id="connection"><option value="official" data-i18n="connectionOfficial"></option><option value="relay" data-i18n="connectionRelay"></option></select>
    </label>
    <label id="relay-url-wrap" hidden><span data-i18n="relayUrl"></span><input id="relay-url" type="url" autocomplete="off" spellcheck="false" placeholder="https://api.example.com">
      <small class="muted" data-i18n="relayHint"></small>
    </label>
    <label><span id="api-key-label" data-i18n="apiKey"></span><input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…"></label>
    <p class="muted" data-i18n="apiKeyHint"></p>
    <p class="warn" id="readonly-note" hidden></p>
    <menu><button value="close" data-i18n="close"></button></menu>
  </form>
</dialog>
<dialog id="library">
  <form method="dialog">
    <h3 data-i18n="pickTree"></h3>
    <div id="library-list"></div>
    <menu><button value="close" data-i18n="close"></button></menu>
  </form>
</dialog>
<dialog id="describe" aria-labelledby="describe-title">
  <form method="dialog">
    <div class="dialog-heading">
      <h3 id="describe-title" data-i18n="describeTitle"></h3>
      <p class="muted" data-i18n="describeHint"></p>
    </div>
    <label><span data-i18n="describeLabel"></span>
      <textarea id="describe-text" rows="8" spellcheck="false"></textarea>
    </label>
    <menu class="row">
      <button id="describe-ask" class="primary" type="button" data-i18n="askJudge"></button>
      <span id="describe-status" class="muted" role="status" aria-live="polite"></span>
    </menu>
    <label id="design-wrap" hidden><span data-i18n="designLabel"></span>
      <textarea id="design-json" rows="16" spellcheck="false"></textarea>
    </label>
    <menu>
      <button id="create-node" class="primary" type="button" data-i18n="createNode" hidden></button>
      <button value="close" data-i18n="close"></button>
    </menu>
  </form>
</dialog>
<dialog id="part-editor" aria-labelledby="part-editor-title">
  <form id="part-edit-form">
    <h3 id="part-editor-title"></h3>
    <p id="part-editor-hint" class="muted"></p>
    <label id="part-name-wrap"><span data-i18n="partName"></span><input id="part-name" maxlength="120" autocomplete="off"></label>
    <label id="part-category-wrap" hidden><span data-i18n="categoryLabel"></span><select id="part-category"></select></label>
    <p id="part-edit-error" class="warn" role="alert"></p>
    <menu><button id="part-edit-cancel" type="button" data-i18n="cancelPartEdit"></button><button type="submit" class="primary" data-i18n="applyPartEdit"></button></menu>
  </form>
</dialog>
<div id="ctx" class="dropdown"></div>
<div id="toast"></div>
<input id="file-input" type="file" accept="application/json,.json" hidden>
<script src="i18n.js"></script>
<script src="tree.js"></script>
<script src="explorer.js"></script>
<script src="app.js"></script>
</body>
</html>
