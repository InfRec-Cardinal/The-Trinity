[project]
name = "trinity-stage2"
version = "1.3.1"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.0,<3"]

[project.scripts]
trinity-stage2 = "trinity_stage2.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trinity_stage2*"]

[tool.setuptools.package-data]
trinity_stage2 = ["prompts/*.txt", "providers.json", "_runtime/**/*.mjs"]
